[project]
name = "neuron-finder"
version = "0.1.0"
description = "Find and steer MLP neurons in local Qwen models from a natural-language property"
requires-python = ">=3.11"
dependencies = [
    "torch==2.11.0",
    "transformers==5.10.2",
    "accelerate>=1.10",
    "numpy>=2.0",
    "rich>=14",
    "typer>=0.20",
    "prompt_toolkit>=3.0.50",
    "anthropic>=0.70",
]

[project.optional-dependencies]
# fast linear-attention kernels for Qwen3.5 (hybrid Gated DeltaNet layers)
qwen35 = ["flash-linear-attention==0.6.0"]

[project.scripts]
nf = "neuron_finder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuron_finder"]
